name: Publish ISO to GHCR

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to download ISO parts from
        required: true
        default: v10-aarch64-boot-2025-12-18
      image_tag:
        description: GHCR image tag to publish
        required: true
        default: 10-aarch64-boot-2025-12-18
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (runner)
        shell: bash
        run: |
          set -euo pipefail
          df -h
          # These folders are large on GitHub-hosted runners and not needed here.
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo apt-get clean || true
          df -h

      - name: Resolve release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "RELEASE_TAG=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
            echo "IMAGE_TAG=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${{ inputs.release_tag }}" >> "$GITHUB_ENV"
            echo "IMAGE_TAG=${{ inputs.image_tag }}" >> "$GITHUB_ENV"
          fi

      - name: Download ISO parts from release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          df -h
          mkdir -p dist output/arm64
          gh release download "$RELEASE_TAG" -R "${{ github.repository }}" -D dist
          ls -lah dist
          cat dist/HeliumOS-10-latest-aarch64-boot.iso.part-* > output/arm64/HeliumOS-10-latest-aarch64-boot.iso
          df -h

      - name: Verify checksum (best-effort)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f dist/SHA256SUMS ]]; then
            expected="$(awk '{print $1}' dist/SHA256SUMS | head -n 1)"
            actual="$(sha256sum output/arm64/HeliumOS-10-latest-aarch64-boot.iso | awk '{print $1}')"
            if [[ "${expected}" != "${actual}" ]]; then
              echo "checksum mismatch: expected=${expected} actual=${actual}" >&2
              exit 1
            fi
          fi

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image (ISO-in-container)
        shell: bash
        run: |
          set -euo pipefail
          df -h
          cat > Dockerfile <<'EOF'
          FROM scratch
          ADD output/arm64/HeliumOS-10-latest-aarch64-boot.iso /HeliumOS-10-latest-aarch64-boot.iso
          EOF

          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --sbom=false \
            -t "ghcr.io/${{ github.repository }}:${IMAGE_TAG}" \
            -t "ghcr.io/${{ github.repository }}:10-aarch64-latest" \
            --push \
            .
